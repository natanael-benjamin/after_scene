<!DOCTYPE html>
<html lang="pt-BR">
    <head><meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>AfterScene | Login</title><link rel="stylesheet" href="style.css">
    </head>
    <body class="login">
        <main class="login-card">
            <img class="login-logo" src="imagens/logo.jpeg" alt="Logo AfterScene">
            <span class="kicker">PLATAFORMA DE ENTRETENIMENTO</span>
            <h1>Entrar no AfterScene</h1>
        <p class="sub">Acesse seu perfil, suas listas, avaliacoes e o catalogo.</p>
        <form action="index.html" method="get">
            <label for="email">E-mail</label>
            <input id="email" type="email" placeholder="seuemail@exemplo.com" required>
            <label for="senha">Senha</label>
            <input id="senha" type="password" placeholder="Digite sua senha" required>
            <button class="btn primary" type="submit">Entrar</button>
        </form>
        <p class="note">Projeto academico . TCC AfterScene<br>Esta e uma tela demonstrativa feita apenas com HTML e CSS.</p>
    </main>
</body>
</html>
