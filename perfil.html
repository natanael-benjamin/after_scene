<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>AfterScene | Perfil</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="header">
            <a class="brand" href="index.html">
            <img class="brand-logo" src="imagens/logo.jpeg" alt="Logo">
            <span>After
                <span>Scene</span>
        </span>
    </a>
    <nav class="nav">
        <a href="index.html">Início</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="listas.html">Minhas listas</a>
        <a href="reviews.html">Reviews</a>
        <a class="active" href="perfil.html">Perfil</a>
        <a href="assinatura.html">Assinatura</a>
    </nav>
</header>
<main>
    <section class="section">
        <span class="kicker">PERFIL DO USUÁRIO</span>
        <h1>Meu perfil</h1>
        <div class="profile-grid">
            <article class="panel profile-card">
                <div class="big-avatar" id="bigAvatar">U</div>
                <h2 id="perfilNome">Usuário AfterScene</h2>
                <p class="muted">Membro desde 2026</p>
            <br>
                <a class="btn small" href="assinatura.html">Gerenciar assinatura</a>
                <br><br>
                <button id="btnLogout" class="btn" style="width:100%">Sair</button>
            </article>
            <article class="panel">
                <h2>Informações da conta</h2>
                <div class="field">
                    <label>Nome</label>
                    <input id="nomeInput" value="Usuário AfterScene" readonly>
                </div>
                <div class="field">
                    <label>E-mail</label>
                    <input id="emailInput" value="usuario@afterscene.com" readonly>
                </div>
                <div class="field">
                    <label>Preferências</label>
                    <input value="Aventura, Drama e Família" readonly>
                </div>
            <br>
                <h3>Resumo</h3>
                <div class="nav-pills">
                    <span class="pill">3 listas</span>
                    <span class="pill">12 títulos salvos</span>
                    <span class="pill">8 avaliações</span>
                </div>
            </article>
        </div>
    </section>
</main>
<footer>
    <div class="footer-brand">After
        <span>Scene</span>
    </div><p>Perfil do usuário</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script>
    (async () => {
        const user = await usuarioAtual();
        if (!user) {
            window.location.href = "login.html";
            return;
        }
        const nome = user.user_metadata?.full_name || user.email;
        document.getElementById("perfilNome").textContent = nome;
        document.getElementById("bigAvatar").textContent = nome.charAt(0).toUpperCase();
        document.getElementById("nomeInput").value = nome;
        document.getElementById("emailInput").value = user.email;
        atualizarHeaderUsuario();
    })();

    document.getElementById("btnLogout").addEventListener("click", deslogarUsuario);
</script>
</body>
</html>
