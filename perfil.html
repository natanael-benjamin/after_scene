<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>AfterScene | Perfil</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="header">
            <a class="brand" href="index.html">
            <img class="brand-logo" src="imagens/logo.jpeg" alt="Logo">
            <span>After
                <span>Scene</span>
        </span>
    </a>
    <nav class="nav">
        <a href="index.html">Início</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="listas.html">Minhas listas</a>
        <a href="reviews.html">Reviews</a>
        <a class="active" href="perfil.html">Perfil</a>
        <a href="assinatura.html">Assinatura</a>
    </nav>
</header>
<main>
    <section class="section">
        <span class="kicker">PERFIL DO USUÁRIO</span>
        <h1>Meu perfil</h1>
        <div class="profile-grid">
            <article class="panel profile-card">
                <div class="big-avatar">U</div>
                <h2>Usuário AfterScene</h2>
                <p class="muted">Membro desde 2026</p>
            <br>
                <a class="btn small" href="assinatura.html">Gerenciar assinatura</a>
            </article>
            <article class="panel">
                <h2>Informações da conta</h2>
                <div class="field">
                    <label>Nome</label>
                    <input value="Usuário AfterScene" readonly>
                </div>
                <div class="field">
                    <label>E-mail</label>
                    <input value="usuario@afterscene.com" readonly>
                </div>
                <div class="field">
                    <label>Preferências</label>
                    <input value="Aventura, Drama e Família" readonly>
                </div>
            <br>
                <h3>Resumo</h3>
                <div class="nav-pills">
                    <span class="pill">3 listas</span>
                    <span class="pill">12 títulos salvos</span>
                    <span class="pill">8 avaliações</span>
                </div>
            </article>
        </div>
    </section>
</main>
<footer>
    <div class="footer-brand">After
        <span>Scene</span>
    </div><p>Perfil do usuário</p>
</footer>
</body>
</html>
